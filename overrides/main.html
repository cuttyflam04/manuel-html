{% extends "base.html" %}

{% block extrahead %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Bungee&family=Gluten:wght@700;800&display=swap">
  <script>
    /* Applique le style choisi avant l'affichage, pour éviter un flash */
    try { var s = localStorage.getItem("mh:style"); if (s) document.documentElement.setAttribute("data-mh-style", s); } catch (e) {}
  </script>
{% endblock %}
